openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Voucher management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: vouchers
    description: Voucher operations
  - name: dropbox
    description: Dropbox sync operations
  - name: sumup
    description: SumUp transaction operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /vouchers:
    get:
      operationId: listVouchers
      tags: [vouchers]
      summary: List all vouchers
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search by Gutscheinnummer
      responses:
        "200":
          description: List of vouchers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Voucher"
    delete:
      operationId: bulkDeleteVouchers
      tags: [vouchers]
      summary: Delete multiple vouchers by ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteRequest"
      responses:
        "200":
          description: Deleted count
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
    post:
      operationId: createVoucher
      tags: [vouchers]
      summary: Create a new voucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoucherInput"
      responses:
        "201":
          description: Created voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"

  /vouchers/stats:
    get:
      operationId: getVoucherStats
      tags: [vouchers]
      summary: Get voucher statistics
      responses:
        "200":
          description: Voucher stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoucherStats"

  /vouchers/{id}:
    get:
      operationId: getVoucher
      tags: [vouchers]
      summary: Get a voucher by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"
        "404":
          description: Not found
    patch:
      operationId: updateVoucher
      tags: [vouchers]
      summary: Update a voucher
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoucherUpdate"
      responses:
        "200":
          description: Updated voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"
        "404":
          description: Not found
    delete:
      operationId: deleteVoucher
      tags: [vouchers]
      summary: Delete a voucher
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /dropbox/sync:
    post:
      operationId: syncFromDropbox
      tags: [dropbox]
      summary: Sync vouchers from Dropbox Voucher.text file
      description: Reads Apps/Rock.Kasse/Voucher.text from Dropbox, adds current date to last record, and uploads CSV back to Dropbox
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /dropbox/scan-invoices:
    post:
      operationId: scanInvoices
      tags: [dropbox]
      summary: Scan all rocInvoiceItem files and match voucher redemptions
      description: Searches all rocInvoiceItem_ files in filialeKalit2017, extracts voucher numbers and dates, updates DB, exports CSV
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /dropbox/export:
    post:
      operationId: exportToDropbox
      tags: [dropbox]
      summary: Export all vouchers as CSV to Dropbox
      description: Exports all vouchers from the database as a CSV file to Apps/Rock.Kasse/ in Dropbox
      responses:
        "200":
          description: Export result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /sumup/transactions:
    get:
      operationId: listSumupTransactions
      tags: [sumup]
      summary: List SumUp transactions with optional filter and sort
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search across all fields
        - in: query
          name: sortKey
          schema:
            type: string
          description: Column name to sort by
        - in: query
          name: sortDir
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: filters
          schema:
            type: string
          description: JSON-encoded object of column->value filters
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SumupTransaction"
    delete:
      operationId: bulkDeleteSumupTransactions
      tags: [sumup]
      summary: Delete multiple transactions by ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SumupBulkDeleteRequest"
      responses:
        "200":
          description: Deleted count
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer

  /sumup/transactions/stats:
    get:
      operationId: getSumupStats
      tags: [sumup]
      summary: Get summary statistics for transactions
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SumupStats"

  /sumup/transactions/columns:
    get:
      operationId: getSumupColumns
      tags: [sumup]
      summary: Get available column names from imported data
      responses:
        "200":
          description: List of column names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /sumup/transactions/{id}:
    patch:
      operationId: updateSumupTransaction
      tags: [sumup]
      summary: Update a transaction's data fields
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SumupTransactionUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SumupTransaction"
        "404":
          description: Not found
    delete:
      operationId: deleteSumupTransaction
      tags: [sumup]
      summary: Delete a single transaction
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /sumup/transactions/bulk-note:
    post:
      operationId: bulkNoteSumupTransactions
      tags: [sumup]
      summary: Set a note on multiple transactions at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SumupBulkNoteRequest"
      responses:
        "200":
          description: Updated count
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer

  /sumup/import:
    post:
      operationId: importSumupFromDropbox
      tags: [sumup]
      summary: Import Transaktionsbericht CSV from Dropbox
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SumupImportResult"

  /sumup/export:
    post:
      operationId: exportSumupToDropbox
      tags: [sumup]
      summary: Export current transactions as new CSV to Dropbox
      responses:
        "200":
          description: Export result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SumupImportResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Voucher:
      type: object
      required:
        - id
        - gutscheinnummer
        - betrag
        - key
      properties:
        id:
          type: integer
        gutscheinnummer:
          type: string
        betrag:
          type: number
        key:
          type: string
        ausstellungsdatum:
          type: ["string", "null"]
        einloesung1:
          type: ["string", "null"]
        einloesung2:
          type: ["string", "null"]
        einloesung3:
          type: ["string", "null"]
        notiz:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    BulkDeleteRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: integer

    VoucherInput:
      type: object
      required:
        - gutscheinnummer
        - betrag
        - key
      properties:
        gutscheinnummer:
          type: string
        betrag:
          type: number
        key:
          type: string
        ausstellungsdatum:
          type: ["string", "null"]
        einloesung1:
          type: ["string", "null"]
        einloesung2:
          type: ["string", "null"]
        einloesung3:
          type: ["string", "null"]
        notiz:
          type: ["string", "null"]

    VoucherUpdate:
      type: object
      properties:
        gutscheinnummer:
          type: string
        betrag:
          type: number
        key:
          type: string
        ausstellungsdatum:
          type: ["string", "null"]
        einloesung1:
          type: ["string", "null"]
        einloesung2:
          type: ["string", "null"]
        einloesung3:
          type: ["string", "null"]
        notiz:
          type: ["string", "null"]

    VoucherStats:
      type: object
      required:
        - total
        - totalBetrag
        - redeemedCount
        - unredeemed
      properties:
        total:
          type: integer
        totalBetrag:
          type: number
        redeemedCount:
          type: integer
        unredeemed:
          type: integer

    SyncResult:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        message:
          type: string
        recordsProcessed:
          type: ["integer", "null"]
        filename:
          type: ["string", "null"]

    SumupTransaction:
      type: object
      required:
        - id
        - data
        - importedAt
      properties:
        id:
          type: integer
        data:
          type: object
          description: All CSV columns as key-value pairs
          additionalProperties:
            type: string
        notiz:
          type: ["string", "null"]
        importedAt:
          type: string

    SumupTransactionUpdate:
      type: object
      properties:
        data:
          type: object
          additionalProperties:
            type: string
        notiz:
          type: ["string", "null"]

    SumupBulkDeleteRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: integer

    SumupBulkNoteRequest:
      type: object
      required: [ids, notiz]
      properties:
        ids:
          type: array
          items:
            type: integer
        notiz:
          type: string

    SumupStats:
      type: object
      required:
        - total
        - totalBetrag
        - totalGebuehr
        - totalNetto
        - importedAt
      properties:
        total:
          type: integer
        totalBetrag:
          type: number
        totalGebuehr:
          type: number
        totalNetto:
          type: number
        currentSaldo:
          type: ["number", "null"]
        importedAt:
          type: ["string", "null"]

    SumupImportResult:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        message:
          type: string
        recordsImported:
          type: ["integer", "null"]
        filename:
          type: ["string", "null"]
