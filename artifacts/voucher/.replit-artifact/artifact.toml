kind = "web"
previewPath = "/"
title = "Voucher"
version = "1.0.0"
id = "artifacts/voucher"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20396

[services.development]
run = "pnpm --filter @workspace/voucher run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/voucher", "run", "build" ]
publicDir = "artifacts/voucher/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20396"
BASE_PATH = "/"
