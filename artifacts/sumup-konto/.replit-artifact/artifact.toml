kind = "web"
previewPath = "/sumup-konto/"
title = "SumUp Konto"
version = "1.0.0"
id = "artifacts/sumup-konto"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/sumup-konto/" ]
localPort = 20974

[services.development]
run = "pnpm --filter @workspace/sumup-konto run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sumup-konto", "run", "build" ]
publicDir = "artifacts/sumup-konto/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20974"
BASE_PATH = "/sumup-konto/"
